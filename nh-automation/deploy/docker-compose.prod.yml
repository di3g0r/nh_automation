# Prod stack: built images, no source mounts, no reload, restart policies
# and health checks (P0-3). Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Mazatlan}
      # Phase 4: pg_hba.conf is generated from these at start
      # (deploy/postgres/pg-hba-entrypoint.sh).
      PLC_ALLOWED_NETWORKS: ${PLC_ALLOWED_NETWORKS}
      DOCKER_SUBNET: ${DOCKER_SUBNET:-172.28.0.0/16}
    entrypoint: ["/bin/sh", "/deploy/pg-hba-entrypoint.sh"]
    command: ["postgres"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/pg-hba-entrypoint.sh:/deploy/pg-hba-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Phase 4: published for the PLCs only. pg_hba.conf accepts PLC logins
    # only from PLC_ALLOWED_NETWORKS and the app user only from the Docker
    # network; also restrict the port with the firewall (README, NFR-2).
    ports:
      - "${PLC_DB_PORT:-5432}:5432"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TZ: ${TZ:-America/Mazatlan}
      PLC_ALLOWED_NETWORKS: ${PLC_ALLOWED_NETWORKS}
      # Shown to the master admin with new PLC credentials (phase 4).
      PLC_DB_HOST: ${PLC_DB_HOST:-}
      PLC_DB_PORT: ${PLC_DB_PORT:-5432}
      # External catalog DB for imports (empty = disabled); see backend/external_sources/README.md
      EXTERNAL_CATALOG_DB_URL: ${EXTERNAL_CATALOG_DB_URL:-}
    volumes:
      # Query files are edited by IT on the server, no rebuild needed.
      - ../backend/external_sources:/app/external_sources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-https://localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: ${TZ:-America/Mazatlan}
    volumes:
      - ./backups:/backups

# Fixed subnet so pg_hba.conf can allow the app only from the Docker network.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  db-data:
  caddy-data:
  caddy-config:
